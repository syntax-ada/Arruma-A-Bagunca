<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Arruma a Bagunça</title>
    <link rel="stylesheet" href="global.css" />
    <link rel="stylesheet" href="style-menu.css" />

  </head>

  <body>
    <main>
      <section id="tela-inicial">
        <img
          src="assets/images/tela_inicial/logotipo_arruma _a_bagunça.png"
          alt="Logotipo do jogo Arruma a Bagunça"
        />

        <button id="botao-jogar" type="button">
          <img
            src="assets/images/tela_inicial/botão_jogar.png"
            alt="Jogar"
          />
        </button>
      </section>

      <section id="tela-fases" class="escondido">
        <img
          class="logotipo-fases"
          src="assets/images/tela_menu/logotipo_arruma_a_Bagunça.png"
          alt="Logotipo do jogo Arruma a Bagunça"
        />

        <div class="botoes-fases">
          <button  id="botao-fase1" type="button" aria-label="Selecionar Fase 1">
            <img
              src="assets/images/tela_menu/fase_1.png"
              alt="Botão da Fase 1"
            />
          </button>

          <button type="button" aria-label="Selecionar Fase 2">
            <img
              src="assets/images/tela_menu/fase_2.png"
              alt="Botão da Fase 2"
            />
          </button>

          <button type="button" aria-label="Selecionar Fase 3">
            <img
              src="assets/images/tela_menu/fase_3.png"
              alt="Botão da Fase 3"
            />
          </button>

          <button type="button" aria-label="Selecionar Fase 4">
            <img
              src="assets/images/tela_menu/fase_4.png"
              alt="Botão da Fase 4"
            />
          </button>
        </div>

        <img
          class="barra-progresso"
          src="assets/images/tela_menu/bar.png"
          alt="Barra de progresso das fases"
        />
      </section>
    </main>
    <script src="js/menu.js"></script>
  </body>
</html>
