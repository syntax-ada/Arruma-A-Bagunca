<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Arruma a Bagunça - Fase 1</title>
    <link rel="stylesheet" href="global.css" />
    <link rel="stylesheet" href="style-fase1.css" />
</head>

<body class="pagina-fase1">
    <button class="btn-voltar-fase" id="btn-voltar-fase" type="button" aria-label="Voltar ao menu inicial">
        <img src="assets/images/mundo_4/botton_voltar.png" alt="Voltar ao menu" />
    </button>
    <!-- HUD Superior esquerdo: Vidas dinâmicas do Monstro (Mundo 5) -->
    <div id="boss-hud-vidas" class="boss-hud-vidas escondido" role="status" aria-label="Vidas do Monstro da Bagunça"></div>
    <button class="btn-som-fase" data-controle-som type="button" aria-label="Desativar música de fundo" aria-pressed="false">
        <span aria-hidden="true">🔊</span>
        <span data-texto-som>Som ligado</span>
    </button>
    <main class="tela-fase1" id="play-area">
        <!-- ETAPA 1: ORGANIZAÇÃO DOS OBJETOS -->
        <div id="tela-organizacao" class="tela-organizacao">
            <header class="topo-fase1">
                <div class="hud-container">
                    <img class="caixa-instrucoes" src="assets/images/tela_fase1/hud_branco.png"
                        alt="Caixa de instruções da Fase 1" />
                    <p class="feedback-message" id="feedback-message" role="status" aria-live="polite">
                        Arraste cada item até a cesta correta!
                    </p>
                </div>
            </header>

            <!-- Aviso da virada de etapa. Escondido por padrão; só aparece numa
                 fase que enfrenta o adversário antes de arrumar a casa. -->
            <p id="aviso-organizacao" class="aviso-organizacao escondido" role="status" aria-live="polite">
                <span aria-hidden="true">🧹</span>
                ARRUME A BAGUNÇA!
            </p>

            <!-- Encerramento da etapa final. Escondido por padrão; math.js revela
                 quando a organização final termina, e os botões de conclusão são
                 anexados aqui dentro.
                 ⚠️ APRESENTAÇÃO PROVISÓRIA: texto, ilustração e layout podem ser
                 trocados sem mexer na lógica de conclusão da fase. -->
            <section id="painel-vitoria" class="painel-vitoria escondido" role="status" aria-live="polite">
                <p class="titulo-vitoria"><span aria-hidden="true">🎉</span> CASA ORGANIZADA!</p>
                <p class="subtitulo-vitoria"><span aria-hidden="true">⭐</span> VOCÊ VENCEU!</p>
            </section>

            <section class="area-objetos" aria-label="Objetos da Fase 1">
                <div class="grid-objetos" id="grid-objetos" role="region" aria-label="Área de organização dos objetos">
                    <!-- Slots e objetos gerados dinamicamente via game.js -->
                </div>
            </section>

            <footer class="categorias" id="area-categorias">
                <!-- Cestas geradas dinamicamente via game.js a partir da configuração da fase. Cada container de cesta inclui <span class="contador-itens">0</span> para contagem numérica dinâmica e <div class="itens-sobrepostos"></div> para sobreposição dos itens. -->
            </footer>
        </div>

        <!-- ETAPA 2: DESAFIO MATEMÁTICO -->
        <section id="tela-matematica" class="tela-matematica escondido" aria-labelledby="titulo-matematica">
            <header class="topo-fase1">
                <div class="hud-container">
                    <img class="caixa-instrucoes" src="assets/images/tela_fase1/hud_branco.png"
                        alt="Caixa de instruções do Desafio Matemático" />
                    <p class="feedback-message hud-texto-matematica" id="titulo-matematica">
                        Desafio Matemático
                    </p>
                </div>
            </header>

            <!-- Adversário da fase e seus corações. Fica escondido até a fase
                 declarar um "boss"; quem preenche e revela é js/math.js. -->
            <section id="area-boss" class="area-boss escondido" aria-labelledby="boss-nome">
                <div class="boss-figura-container">
                    <img class="boss-imagem" id="boss-imagem" alt="Monstro da Bagunça" />
                    <img class="boss-risada" id="boss-risada" src="assets/images/mundo_5/risada_monstro.png" alt="HAHAHAHA!" />
                </div>
                <p class="boss-nome escondido" id="boss-nome"></p>
                <p class="boss-vida escondido" role="status" aria-live="polite">
                    <span class="boss-coracoes" id="boss-coracoes" aria-hidden="true"></span>
                    <span class="boss-contagem" id="boss-contagem"></span>
                </p>
            </section>

            <div class="painel-matematica">
                <h2 class="pergunta-matematica" id="pergunta-matematica">
                    <!-- Enunciado definido por math.js conforme a operação da fase -->
                    Quantos objetos você organizou?
                </h2>

                <div class="resumo-quantidades" id="resumo-quantidades"
                    aria-label="Quantidades organizadas por categoria">
                    <!-- Itens de resumo gerados dinamicamente via math.js -->
                </div>

                <div class="opcoes-matematica" id="opcoes-matematica" role="group"
                    aria-label="Alternativas de resposta">
                    <!-- Alternativas geradas dinamicamente via math.js -->
                </div>

                <p class="feedback-matematica" id="feedback-matematica" role="status" aria-live="polite">
                    Escolha uma das opções acima.
                </p>
            </div>
        </section>
    </main>
    <script src="js/progresso.js"></script>
    <script src="js/audio.js"></script>
    <script src="js/operacoes.js"></script>
    <script src="js/math.js"></script>
    <script src="js/game.js"></script>
    <script src="js/mundos/mundo1.js"></script>
    <script src="js/mundos/mundo2.js"></script>
    <script src="js/mundos/mundo3.js"></script>
    <script src="js/mundos/mundo4.js"></script>
    <script src="js/mundos/mundo5.js"></script>
    <script src="js/main.js"></script>
    <script src="js/dev.js"></script>
</body>

</html>
