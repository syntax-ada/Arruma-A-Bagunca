<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Teste Menu Boss</title>
</head>
<body style="margin: 0; background: #222;">
  <iframe id="menuFrame" src="../index.html?view=mundos&dev=true" style="width: 1280px; height: 720px; border: none;"></iframe>
  <div id="resultado" style="position: fixed; bottom: 10px; left: 10px; color: #00ff00; font-family: monospace; font-size: 16px; background: rgba(0,0,0,0.9); padding: 12px; z-index: 9999;"></div>
  <script>
    const frame = document.querySelector("#menuFrame");
    const out = document.querySelector("#resultado");

    frame.onload = () => {
      const doc = frame.contentDocument;
      const sidebar = doc.querySelector("#sidebar-boss");
      const btnFechar = doc.querySelector("#btn-fechar-sidebar-boss");
      const btnIcone = doc.querySelector("#btn-icone-boss");
      const btnJogar = doc.querySelector("#btn-jogar-boss");

      const passo1 = !sidebar.classList.contains("escondido") && btnIcone.classList.contains("escondido");
      out.innerHTML = `Passo 1 (Sidebar visível inicialmente): ${passo1 ? "OK" : "FALHOU"}<br>`;

      // Clicar no botão fechar da sidebar
      btnFechar.click();
      const passo2 = sidebar.classList.contains("escondido") && !btnIcone.classList.contains("escondido");
      out.innerHTML += `Passo 2 (Após fechar: sidebar oculta e ícone visível): ${passo2 ? "OK" : "FALHOU"}<br>`;

      // Clicar no ícone flutuante para reabrir
      btnIcone.click();
      const passo3 = !sidebar.classList.contains("escondido") && btnIcone.classList.contains("escondido");
      out.innerHTML += `Passo 3 (Após clicar no ícone: sidebar reaberta): ${passo3 ? "OK" : "FALHOU"}<br>`;

      // Fechar novamente para ver o ícone flutuante no screenshot
      btnFechar.click();
      out.innerHTML += `TESTE CONCLUÍDO COM SUCESSO!`;
    };
  </script>
</body>
</html>
